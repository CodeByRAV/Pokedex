<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./css/standard.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="./css/media.css">
    <link rel="stylesheet" href="./css/dialog.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Ubuntu+Sans:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <script src="./js/template.js"></script>
</head>

<body onload="init()">
    <header>
        <div class="logo">
            <h1>Pokedex</h1>
            <img class="pokeball" src="./assets/icon/pokeball.svg"></img>
        </div>
        <nav>
             <input id="search-input" type="text" placeholder="Search Pokemon..." onkeydown="if (event.keyCode === 13) {filterAndShowNames(this.value)}"> <button id="search-button" onclick="filterAndShowNames(document.getElementById('search-input').value)">Search</button>
        </nav>
    </header>
    <main>
        <section id="pokemon-list" class="pokedex">
            <div id="pokemon-names">
            </div>
            <dialog id="pokemon-dialog" onclose="dialogClosed()">
                <div id="pokemon-dialog-content"></div>
            </dialog>
            <div id="spinner"></div>
            <div class="load-more-wrapper">
                <div id="pokemon-container" class="pokemon-container">
                </div>
                
                <div class="load-more" id="load-more-container">
                    <button id="load-more-button" class="load-more-button d-none" onclick="loadMorePokemon()">Show More</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Pokedex. All rights reserved.</p>
    </footer>
    <script src="./js/dom_manipulation.js"></script>
    <script src="script.js"></script>
</body>

</html>
